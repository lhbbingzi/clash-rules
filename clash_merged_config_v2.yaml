# Clash / Mihomo 合并配置模板（精简策略组版）
# 用法：
# 1. 把 proxy-providers.airport.url 改成你的机场订阅链接
# 2. 把 proxies 里的自建 Trojan 信息改成你的真实节点
# 3. 上传到 GitHub 后，用 raw.githubusercontent.com 链接导入 Clash / Mihomo
#
# 本版调整：
# - 去掉“自动选择”、“其他01”、“其他02”策略组
# - “全球直连”不再显示为策略组，规则直接使用 DIRECT
# - “漏网之鱼”不再显示为策略组，MATCH 直接走“节点选择”

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
  - name: "自建-Trojan-01"
    type: trojan
    server: "www.chuangyuan.site"
    port: 443
    password: "Noigejkjsg56YU"
    sni: "www.chuangyuan.site"
    udp: true
    skip-cert-verify: false
proxy-providers:
  airport:
    type: http
    url: https://d26osgcic9cyru.cloudfront.net/api/v1/client/subscribe?token=55308890386e225377121ccaf6c57c01
    path: ./proxy_providers/airport.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 自建-Trojan-01
  - DIRECT
  use:
  - airport
- name: Tiktok节点
  type: select
  proxies:
  - 节点选择
  - 自建-Trojan-01
  - DIRECT
  use:
  - airport
- name: Facebook节点
  type: select
  proxies:
  - 节点选择
  - 自建-Trojan-01
  - DIRECT
  use:
  - airport
- name: WhatsApp节点
  type: select
  proxies:
  - 节点选择
  - 自建-Trojan-01
  - DIRECT
  use:
  - airport
- name: OpenAi节点
  type: select
  proxies:
  - 节点选择
  - 自建-Trojan-01
  - DIRECT
  use:
  - airport
