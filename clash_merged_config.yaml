# ========================
# 5) 分流规则：顺序非常重要
# ========================
rules:
  # 国内 / 局域网 / 常见直连增强
  - RULE-SET,local_area_network,全球直连
  - RULE-SET,unban,全球直连
  - RULE-SET,china_domain,全球直连
  - RULE-SET,china_company_ip,全球直连
  - RULE-SET,china_ip,全球直连
  - RULE-SET,china_media,全球直连
  - RULE-SET,download,全球直连
  - RULE-SET,apple,全球直连
  - RULE-SET,microsoft,全球直连

  # 业务专用分流
  - RULE-SET,tiktok,Tiktok节点
  - RULE-SET,facebook,Facebook节点
  - RULE-SET,whatsapp,WhatsApp节点
  - RULE-SET,openai_acl,OpenAi节点
  - RULE-SET,openai_ai,OpenAi节点

  # 自定义其他规则
  - RULE-SET,qita01,其他01
  - RULE-SET,qita02,其他02

  # 通用代理规则
  - RULE-SET,proxy_lite,节点选择
  - RULE-SET,cmblog,节点选择

  # 最终兜底
  - GEOIP,CN,全球直连
  - MATCH,漏网之鱼
