# Clash / Mihomo 合并配置模板
# 用法：
# 1. 把 proxy-providers.airport.url 改成你的机场订阅链接
# 2. 把 proxies 里的自建 Trojan 信息改成你的真实节点
# 3. 上传到 GitHub 后，用 raw.githubusercontent.com 链接导入 Clash / Mihomo

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ========================
# 1) 自建节点
# ========================
proxies:
  - name: "美国服务器01"
    type: trojan
    server: "www.chuangyuan.site"
    port: 443
    password: "Noigejkjsg56YU"
    sni: "www.chuangyuan.site"
    udp: true
    skip-cert-verify: false


# 2) 机场订阅
# ========================
proxy-providers:
  airport:
    type: http
    url: "https://d26osgcic9cyru.cloudfront.net/api/v1/client/subscribe?token=55308890386e225377121ccaf6c57c01"
    path: ./proxy_providers/airport.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true

# ========================
# 3) 策略组：由 jiandanqian.ini 的 custom_proxy_group 转换而来
# ========================
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: 自动选择
    type: url-test
    proxies:
      - 自建-Trojan-01
    use:
      - airport
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000

  - name: Tiktok节点
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: Facebook节点
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: WhatsApp节点
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: OpenAi节点
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: 其他01
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: 其他02
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择

  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - 全球直连
      - 自动选择
      - 自建-Trojan-01
      - DIRECT
    use:
      - airport

# ========================
# 4) 远程规则集：由 jiandanqian.ini 的 ruleset 转换而来
# 注意：ACL4SSR 的 Clash/*.list 通常是 classical 格式
# ========================
